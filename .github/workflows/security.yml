name: Dependency security
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      # Metadata-only: no app installs, lifecycle scripts, or deployment keys.
      - name: Audit every locked npm dependency
        working-directory: .
        run: npm audit --package-lock-only --ignore-scripts --json | tee "$RUNNER_TEMP/npm-audit.json"
      - name: Retain report even when the audit fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-security-report
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: error
          retention-days: 14
