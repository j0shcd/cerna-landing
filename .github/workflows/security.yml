name: Dependency security
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      # No app dependencies, lifecycle hooks, provider keys or financial data.
      - name: Verify the scanner fails closed
        run: python -S tests/test_security_audit.py
      - name: Scan all recorded versions against current OSV advisories
        run: python -S scripts/security_audit.py | tee security-report.json
      - name: Retain report even when the scan fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: security-report.json
          if-no-files-found: error
          retention-days: 14
