name: Dependency validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Dependency validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check the merge policy
        run: python3 -S tests/test_dependabot_automerge.py
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Types, units and production build
        run: |
          npm run check
          npm test
          npm run build
      - name: Prepare headless Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
