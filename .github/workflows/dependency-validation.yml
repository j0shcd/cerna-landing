name: Dependency validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Dependency validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Check the merge policy
        run: |
          python3 -S tests/test_dependabot_automerge.py
          python3 -S tests/test_prepare_ci_chrome.py
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Types, units and production build
        run: |
          npm run check
          npm test
          npm run build
      - name: Check browser security regressions
        run: node --test tests/browser-security.test.mjs
      - name: Update Stable Chrome in the disposable runner
        run: |
          python3 -S scripts/prepare_ci_chrome.py
          npx --no-install playwright install-deps chrome
          google-chrome --version
      - name: Browser tests
        run: npm run test:e2e
